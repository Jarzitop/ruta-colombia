name: One-time Expo SDK compatibility refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-expo-refresh.yml

permissions:
  contents: write

jobs:
  patch-expo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh Expo patch and lockfile using npm resolver
        run: |
          npm install expo@57.0.28 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency metadata only, never any private data
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Expo already at requested patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'fix(deps): align Expo patch release with doctor recommendations'
          git push origin HEAD:main
