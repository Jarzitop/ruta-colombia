name: CI · TypeScript y datos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar MVP sin compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24 + caché npm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: No publicar datos GTFS privados
        run: |
          npm run test:private-data-gate
          npm run check:private-data
      - name: Verificar fixture de la próxima APK interna
        run: |
          npm run test:preview-data
          npm run check:preview-data
      - name: Contrato de datos
        run: npm run validate:data
      - name: Pruebas del validador
        run: npm run test:validator
      - name: Pruebas del motor
        run: npm run test:routing
      - name: Pruebas de selección de viaje
        run: npm run test:planner
      - name: Pruebas del encuadre del mapa
        run: npm run test:map
      - name: Regresiones de viajes documentados
        run: |
          npm run test:expected-trips
          npm run verify:synthetic-trips
          npm run test:bogota-handoff
      - name: Comprobar primera muestra de Bogotá si existe
        run: npm run verify:bogota-pilot
      - name: Etiquetas de procedencia de catálogo
        run: npm run test:catalog-notice
      - name: Calendario y excepciones GTFS
        run: npm run test:gtfs-calendar
      - name: Viajes programados y variantes sintéticas
        run: npm run test:scheduled
      - name: Consulta por fecha en la interfaz ficticia
        run: npm run test:synthetic-schedule
      - name: TypeScript
        run: npm run typecheck
      - name: Compatibilidad con Expo
        run: npm run doctor
