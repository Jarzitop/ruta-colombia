name: Android APK · bajo demanda

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: EAS preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24 + caché npm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verificar ausencia de GTFS privado
        run: |
          npm run test:private-data-gate
          npm run check:private-data
      - name: Excluir catálogo real de la APK interna
        run: |
          npm run test:preview-data
          npm run check:preview-data
      - name: Comprobar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Falta el secreto EXPO_TOKEN. Consulta docs/automation.md.'
            exit 1
          fi
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar TypeScript y motor
        run: |
          npm run validate:data
          npm run test:validator
          npm run test:routing
          npm run test:planner
          npm run test:map
          npm run test:expected-trips
          npm run test:gtfs-calendar
          npm run test:scheduled
          npm run test:synthetic-schedule
          npm run test:service-time
          npm run verify:synthetic-trips
          npm run verify:bogota-pilot
          npm run typecheck
      - name: Configurar Expo y EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compilar APK preview en EAS
        run: eas build --platform android --profile preview --non-interactive
