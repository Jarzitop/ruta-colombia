name: Prepare Expo dependency patch on isolated branch
on:
  push:
    branches: [maintenance/expo-57-0-30]
    paths: [.github/workflows/expo-patch-once.yml]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve SDK patch dependencies without executing scripts
        run: npm install expo@57.0.30 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package and lockfile only, remove temporary workflow
        run: |
          rm .github/workflows/expo-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json .github/workflows/expo-patch-once.yml
          git commit -m 'fix(deps): align Expo SDK 57 patch and lockfile'
          git push origin HEAD:maintenance/expo-57-0-30
